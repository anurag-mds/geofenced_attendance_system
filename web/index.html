<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimbus | A quieter way to arrive</title>
    <style>
        :root { --ink: #101010; --paper: #ffffff; --chalk: #ffffff; --line: rgba(16,16,16,.22); --error: #c1121f; --error-soft: #fff1f2; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; overflow: hidden; color: var(--ink); background: var(--paper); font-family: Georgia, 'Times New Roman', serif; }
        .stage { min-height: 100vh; position: relative; isolation: isolate; display: grid; place-items: center; padding: 7vw; overflow: hidden; background: #ffffff; }
        .stage::before, .stage::after { content: ''; position: absolute; z-index: -1; border: 1px solid var(--line); border-radius: 50%; animation: drift 16s ease-in-out infinite alternate; }
        .stage::before { width: 66vw; height: 66vw; right: -22vw; top: -18vw; }
        .stage::after { width: 38vw; height: 38vw; left: -15vw; bottom: -14vw; animation-delay: -5s; }
        .grain { position: absolute; inset: 0; opacity: .18; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E"); }
        .mark { position: absolute; top: 32px; left: 42px; font: 700 12px/1.2 Arial, sans-serif; letter-spacing: .28em; text-transform: uppercase; }
        .art { position: absolute; width: min(52vw, 720px); aspect-ratio: 1; right: 5vw; top: 8vh; transform: rotate(-12deg); opacity: .94; animation: breathe 9s ease-in-out infinite; }
        .art span { position: absolute; display: block; }
        .ring { inset: 11%; border: 1px solid var(--ink); border-radius: 50%; }
        .ring:nth-child(2) { inset: 27%; border-width: 2px; }
        .bar { width: 72%; height: 13%; top: 42%; left: 14%; background: var(--ink); transform: rotate(38deg); }
        .bar:nth-child(4) { width: 48%; height: 4%; top: 58%; left: 33%; transform: rotate(-38deg); background: transparent; border-top: 1px solid var(--ink); }
        .dot { width: 9%; aspect-ratio: 1; right: 17%; top: 22%; border-radius: 50%; background: var(--ink); }
        .copy { width: min(100%, 650px); margin-right: auto; position: relative; z-index: 1; animation: arrive .9s cubic-bezier(.22,.61,.36,1) both; }
        .eyebrow { margin: 0 0 22px; font: 700 11px/1.2 Arial, sans-serif; letter-spacing: .3em; text-transform: uppercase; }
        h1 { max-width: 620px; margin: 0; font-size: clamp(4rem, 9vw, 9rem); font-weight: 400; line-height: .84; letter-spacing: -.06em; }
        .caption { max-width: 330px; margin: 34px 0 30px 8px; font-size: 17px; line-height: 1.5; }
        .enter { border: 1px solid var(--ink); border-radius: 0; padding: 15px 28px; color: var(--chalk); background: var(--ink); font: 700 11px Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; transition: background .25s, color .25s, transform .25s; }
        .enter:hover { color: var(--ink); background: transparent; transform: translateY(-3px); }
        .login-panel { display: none; position: absolute; z-index: 3; width: min(90vw, 390px); padding: 34px; background: rgba(255,255,255,.97); border: 1px solid var(--ink); box-shadow: 12px 12px 0 var(--ink); animation: arrive .45s ease both; }
        .login-panel.open { display: block; }
        .login-panel h2 { margin: 0 0 25px; font-size: 30px; font-weight: 400; }
        .error-message { display: none; margin: 0 0 18px; padding: 11px; color: var(--error); background: var(--error-soft); border-left: 3px solid var(--error); font: 13px/1.4 Arial, sans-serif; }
        .error-message.visible { display: block; }
        label { display: block; margin: 16px 0 7px; font: 700 10px Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
        input { width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; color: var(--ink); background: transparent; font: 16px Georgia, serif; }
        input:focus { outline: 0; border-bottom-width: 2px; }
        .login-button { width: 100%; margin-top: 28px; padding: 14px; border: 1px solid var(--ink); color: var(--chalk); background: var(--ink); font: 700 11px Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; }
        .login-button:disabled { opacity: .65; cursor: wait; }
        @keyframes arrive { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes drift { to { transform: translate(2vw, 3vh) rotate(18deg); } }
        @keyframes breathe { 50% { transform: rotate(-7deg) scale(1.04); } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
        @media (max-width: 700px) { .stage { place-items: end start; padding: 27vh 9vw 12vh; } .mark { top: 24px; left: 24px; } .art { width: 100vw; right: -32vw; top: 5vh; opacity: .35; } h1 { font-size: clamp(4rem, 20vw, 7rem); } .caption { margin-top: 25px; } .login-panel { box-shadow: 7px 7px 0 var(--ink); } }
    </style>
</head>
<body>
    <main class="stage">
        <div class="grain" aria-hidden="true"></div>
        <div class="mark">Nimbus / 01</div>
        <div class="art" aria-hidden="true"><span class="ring"></span><span class="ring"></span><span class="bar"></span><span class="bar"></span><span class="dot"></span></div>
        <section class="copy" id="welcome">
            <p class="eyebrow">Attendance, considered</p>
            <h1>Arrive.<br>Be present.</h1>
            <p class="caption">A considered space for the rhythm of your working day.</p>
            <button class="enter" type="button" id="enterButton">Enter workspace</button>
        </section>
        <section class="login-panel" id="loginPanel" aria-labelledby="loginTitle">
            <h2 id="loginTitle">Welcome in.</h2>
            <div id="errorMessage" class="error-message"></div>
            <form action="LoginServlet" method="post" id="loginForm">
                <label for="empCode">Employee code</label>
                <input type="text" id="empCode" name="empCode" required autocomplete="username">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
                <button type="submit" class="login-button" id="loginButton">Login</button>
            </form>
        </section>
    </main>
    <script>
        (function () {
            const panel = document.getElementById('loginPanel');
            const enter = document.getElementById('enterButton');
            const loginForm = document.getElementById('loginForm');
            const loginButton = document.getElementById('loginButton');
            const params = new URLSearchParams(window.location.search);
            const messages = { wrong_password: 'Incorrect password. Please try again.', user_not_found: 'Employee code not found.', inactive_user: 'Your account is inactive. Please contact HR.', empty_fields: 'Please enter both fields.', db_error: 'The system is unavailable. Please try again later.', invalid_role: 'Invalid user role.', unknown_error: 'Something went wrong. Please try again.' };
            function openLogin() { panel.classList.add('open'); enter.setAttribute('aria-expanded', 'true'); document.getElementById('empCode').focus(); }
            enter.addEventListener('click', openLogin);
            loginForm.addEventListener('submit', function () {
                loginButton.disabled = true;
                loginButton.textContent = 'Logging in...';
                loginButton.setAttribute('aria-busy', 'true');
            });
            const error = messages[params.get('error')];
            if (error) { document.getElementById('errorMessage').textContent = error; document.getElementById('errorMessage').classList.add('visible'); openLogin(); }
        })();
    </script>
</body>
</html>
